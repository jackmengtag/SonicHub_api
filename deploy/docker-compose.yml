services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonichub
      POSTGRES_PASSWORD: sonichub
      POSTGRES_DB: sonichub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonichub -d sonichub"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://sonichub:sonichub@postgres:5432/sonichub?sslmode=disable"
      JWT_SECRET: "sonichub-dev-secret-change-me"
      DEMO_AUTH_CODE: "1234"
      SEED_DEMO: "true"
      ADMIN_PHONE: "13800138000"
      MEDIA_DIR: "/app/data/media"
      MIGRATIONS_DIR: "/app/migrations"
    ports:
      - "8080:8080"
    volumes:
      - media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
